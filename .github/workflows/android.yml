name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify cross-platform product contract and store assets
        run: |
          python3 scripts/verify_platform_contract.py
          python3 scripts/verify_store_assets.py

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure temporary CI signing
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/ci-release.jks"
          keytool -genkeypair             -keystore "$keystore_path"             -storepass android             -keypass android             -alias ci             -keyalg RSA             -keysize 2048             -validity 1             -dname "CN=CI"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=android"
            echo "keyAlias=ci"
            echo "keyPassword=android"
          } > key.properties

      - name: Verify project and build release artifacts
        run: ./gradlew testDebugUnitTest lintDebug detekt assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease writeDependencyAudit --stacktrace

      - name: Audit resolved application, test and build dependencies
        run: python3 scripts/audit_android_dependencies.py

      - name: Inspect compiled release packages
        uses: ./.github/actions/verify-android-package

      - name: Run repository tooling regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-verification-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/dependencies/
            app/build/reports/detekt/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f key.properties
          rm -f "$RUNNER_TEMP/ci-release.jks"



  android-device:
    name: Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download tested application and instrumentation APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-verification-${{ github.sha }}
          path: verification
      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
      - name: Install verified parser for release smoke checks
        run: |
          python3 -m venv "$RUNNER_TEMP/release-verification-python"
          "$RUNNER_TEMP/release-verification-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
          echo "$RUNNER_TEMP/release-verification-python/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration and privacy tests
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android_device_tests.sh
      - name: Upload current masked store screenshots
        if: matrix.api == 36
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: google-play-screenshots-${{ github.sha }}
          path: build/store-screenshots/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows native
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        shell: pwsh
        run: python scripts/verify_ci_supply_chain.py

      - name: Verify cross-platform product contract
        shell: pwsh
        run: python scripts/verify_platform_contract.py

      - name: Configure
        shell: pwsh
        run: cmake -S windows -B build/windows -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Verify packaged Windows executable
        shell: pwsh
        run: windows/scripts/verify-binary.ps1 -Executable "build/windows/Release/PasswordGenerator.exe"

      - name: Upload Windows UI preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: password-generator-windows-ui-preview-${{ github.sha }}
          path: build/windows/Release/PasswordGenerator.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS native
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify cross-platform product contract
        run: python3 scripts/verify_platform_contract.py

      - name: Test
        working-directory: macos
        run: swift test -c release

      - name: Build
        working-directory: macos
        run: swift build -c release

      - name: Validate application bundle packaging
        run: |
          bash macos/scripts/package-app.sh "$RUNNER_TEMP/password-generator-macos"
          plutil -lint "$RUNNER_TEMP/password-generator-macos/Password Generator.app/Contents/Info.plist"
          test -s "$RUNNER_TEMP/password-generator-macos/Password Generator.app/Contents/Resources/AppIcon.icns"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep CE
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  verify:
    if: always()
    needs: [build, android-device, windows, macos, dependency-review, semgrep, gitleaks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Enforce verification results
        env:
          ANDROID_DEVICE_RESULT: ${{ needs.android-device.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$ANDROID_DEVICE_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$MACOS_RESULT" = "success"
          test "$SEMGREP_RESULT" = "success"
          test "$GITLEAKS_RESULT" = "success"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = "success"
          else
            test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
          fi
