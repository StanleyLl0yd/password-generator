name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure temporary CI signing
        run: |
          keystore_path="$RUNNER_TEMP/ci-release.jks"
          keytool -genkeypair \
            -keystore "$keystore_path" \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=android"
            echo "keyAlias=ci"
            echo "keyPassword=android"
          } > key.properties

      - name: Verify project and build release artifacts
        run: ./gradlew --write-verification-metadata sha256 testDebugUnitTest lintDebug detekt assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-verification-${{ github.sha }}
          path: |
            gradle/verification-metadata.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f key.properties
          rm -f "$RUNNER_TEMP/ci-release.jks"
