name: Refresh verification metadata

on:
  push:
    branches:
      - automation/app-icon-2026-08-31
    paths:
      - .github/workflows/refresh-verification.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/app-icon-2026-08-31
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Generate metadata fix branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B fix/dependency-verification-metadata origin/main
          ./gradlew --write-verification-metadata sha256 help --stacktrace
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git diff --cached --check
          if git diff --cached --exit-code --quiet; then
            echo 'No verification metadata changes were generated.' >&2
            exit 1
          fi
          git commit -m 'build: refresh dependency verification metadata'
          git push origin HEAD:refs/heads/fix/dependency-verification-metadata
