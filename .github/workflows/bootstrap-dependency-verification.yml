name: Bootstrap Dependency Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Check bootstrap state
        id: state
        run: |
          if [ -f gradle/verification-metadata.xml ] && [ -f config/detekt/baseline.xml ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.state.outputs.complete == 'false'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.state.outputs.complete == 'false'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android 36 platform
        if: steps.state.outputs.complete == 'false'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure temporary signing
        if: steps.state.outputs.complete == 'false'
        run: |
          keystore_path="$RUNNER_TEMP/ci-release.jks"
          keytool -genkeypair \
            -keystore "$keystore_path" \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=android"
            echo "keyAlias=ci"
            echo "keyPassword=android"
          } > key.properties

      - name: Generate Detekt baseline
        if: steps.state.outputs.complete == 'false'
        run: ./gradlew detektBaseline --stacktrace

      - name: Generate SHA-256 verification metadata
        if: steps.state.outputs.complete == 'false'
        run: ./gradlew --write-verification-metadata sha256 testDebugUnitTest lintDebug detekt assembleRelease --stacktrace

      - name: Commit generated verification files
        if: steps.state.outputs.complete == 'false'
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/detekt/baseline.xml gradle/verification-metadata.xml
          git commit -m "build: add verification baselines"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f key.properties
          rm -f "$RUNNER_TEMP/ci-release.jks"
