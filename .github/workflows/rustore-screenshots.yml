name: RuStore screenshots

on:
  push:
    branches:
      - automation/rustore-screenshots-2026-08-31

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb shell cmd uimode night no || true
            ./gradlew --dependency-verification=off assembleDebug assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            RUNNER="$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\) (target=com.sl.passwordgenerator)$/\1/p' | tr -d '\r')"
            test -n "$RUNNER"
            TEST_OUTPUT="$(adb shell am instrument -w -r -e class com.sl.passwordgenerator.RuStoreScreenshotTest "$RUNNER")"
            printf '%s\n' "$TEST_OUTPUT"
            printf '%s\n' "$TEST_OUTPUT" | grep -q '^OK (1 test)'
            mkdir -p rustore-screenshots
            adb pull /sdcard/Android/data/com.sl.passwordgenerator/files/rustore/. rustore-screenshots/
            test "$(find rustore-screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 3
            ls -lh rustore-screenshots
            file rustore-screenshots/*.png

      - name: Upload RuStore screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustore-phone-screenshots
          path: rustore-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
