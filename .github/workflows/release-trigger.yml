name: Dispatch Android Release

on:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger

permissions:
  actions: write
  contents: read

concurrency:
  group: release-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(tr -d '[:space:]' < .github/release-trigger)"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          if [[ "$release_tag" != "v$app_version" ]]; then
            echo "Release tag $release_tag does not match app version v$app_version." >&2
            exit 1
          fi

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$release_tag"
