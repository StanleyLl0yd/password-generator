name: Unified Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the unified product version
        required: true
        type: string

permissions: {}

concurrency:
  group: unified-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require main and validate tag format
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify cross-platform product contract
        run: python3 scripts/verify_platform_contract.py

      - name: Validate release source and versions
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          version="$(tr -d '[:space:]' < VERSION)"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          namespace="$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          application_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"

          test "$RELEASE_TAG" = "v$version"
          test "$version_name" = "$version"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          (( version_code > 0 ))
          test "$namespace" = "com.sl.passwordgenerator"
          test "$application_id" = "com.sl.passwordgenerator"
          test -f ".github/release-notes/$RELEASE_TAG.md"

          max_previous_code=0
          max_previous_tag=""
          while IFS= read -r tag; do
            [[ "$tag" == "$RELEASE_TAG" ]] && continue
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            previous_file="$(git show "${tag}:app/build.gradle.kts" 2>/dev/null || true)"
            [[ -n "$previous_file" ]] || continue
            previous_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' <<< "$previous_file" | head -1)"
            [[ "$previous_code" =~ ^[0-9]+$ ]] || continue
            if (( previous_code > max_previous_code )); then
              max_previous_code="$previous_code"
              max_previous_tag="$tag"
            fi
          done < <(git tag --list 'v*')

          if (( version_code <= max_previous_code )); then
            echo "versionCode $version_code must be greater than $max_previous_code from $max_previous_tag." >&2
            exit 1
          fi

      - name: Require successful main CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"

          wait_for_workflow() {
            local workflow_name="$1"
            for attempt in $(seq 1 48); do
              runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$release_sha&per_page=100")"
              record="$(jq -c --arg name "$workflow_name" '[.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty' <<< "$runs")"

              if [[ -n "$record" ]]; then
                status="$(jq -r '.status' <<< "$record")"
                conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
                run_url="$(jq -r '.html_url' <<< "$record")"
                if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                  echo "$workflow_name: success ($run_url)"
                  return 0
                fi
                if [[ "$status" == "completed" ]]; then
                  echo "$workflow_name failed with conclusion '$conclusion': $run_url" >&2
                  return 1
                fi
              fi
              if (( attempt < 48 )); then sleep 15; fi
            done
            echo "Timed out waiting for $workflow_name on $release_sha." >&2
            return 1
          }

          wait_for_workflow "CI"
          wait_for_workflow "CodeQL"

  android:
    name: Android signed packages
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_CERT_SHA256: f02571c40741e2cb071564f5b63fd3dc38a875d0eda11a8c42269ed635bc2a58

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          keystore_path="$RUNNER_TEMP/password-generator-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Test and build signed Android packages
        run: ./gradlew testDebugUnitTest lintDebug detekt assembleRelease bundleRelease --stacktrace

      - name: Verify and package Android release
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          source_aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_apk"
          test -s "$source_aab"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"
          package_line="$("$aapt" dump badging "$source_apk" | head -n 1)"
          package_name="$(sed -n "s/^package: name='\([^\']*\)'.*/\1/p" <<< "$package_line")"
          package_version_code="$(sed -n "s/.*versionCode='\([^\']*\)'.*/\1/p" <<< "$package_line")"
          package_version_name="$(sed -n "s/.*versionName='\([^\']*\)'.*/\1/p" <<< "$package_line")"
          source_version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test "$package_name" = "com.sl.passwordgenerator"
          test "$package_version_name" = "${RELEASE_TAG#v}"
          test "$package_version_code" = "$source_version_code"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apk_report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "$source_apk" | tee "$apk_report"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$apk_report"
          grep -F 'Number of signers: 1' "$apk_report"
          apk_fingerprint="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$apk_report" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$apk_fingerprint" = "$expected"
          jarsigner -verify "$source_aab" | tee "$RUNNER_TEMP/jarsigner-report.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/jarsigner-report.txt"
          aab_fingerprint="$(keytool -printcert -jarfile "$source_aab" | awk -F': ' '/SHA256:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$aab_fingerprint" = "$expected"
          mkdir -p release
          version="${RELEASE_TAG#v}"
          apk_name="password-generator-$version-android.apk"
          aab_name="password-generator-$version-android.aab"
          cp "$source_apk" "release/$apk_name"
          cp "$source_aab" "release/$aab_name"
          (cd release && sha256sum "$apk_name" > "$apk_name.sha256" && sha256sum "$aab_name" > "$aab_name.sha256" && sha256sum --check "$apk_name.sha256" && sha256sum --check "$aab_name.sha256")

      - name: Attest Android packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/password-generator-*-android.apk
            release/password-generator-*-android.aab

      - name: Upload Android release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: password-generator-android-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f key.properties
          rm -f "$RUNNER_TEMP/password-generator-release.jks"

  windows:
    name: Windows signed executable
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify product contract
        shell: pwsh
        run: python scripts/verify_platform_contract.py

      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake -S windows -B build/windows -A x64
          cmake --build build/windows --config Release --parallel
          ctest --test-dir build/windows -C Release --output-on-failure

      - name: Sign and verify Windows executable
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is required for a unified public release." }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required for a unified public release." }
          $exe = "build/windows/Release/PasswordGenerator.exe"
          if (-not (Test-Path $exe)) { throw "Windows executable was not built." }
          $pfx = Join-Path $env:RUNNER_TEMP "password-generator-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfx /p $env:CERTIFICATE_PASSWORD $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            & $signtool.FullName verify /pa /all /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed." }
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne "Valid") { throw "Windows signature status is '$($signature.Status)'." }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          $name = "password-generator-$version-windows-x64.exe"
          Copy-Item "build/windows/Release/PasswordGenerator.exe" "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "release/$name.sha256" -Encoding ascii

      - name: Attest Windows executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/password-generator-*-windows-x64.exe

      - name: Upload Windows release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: password-generator-windows-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS signed and notarized image
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify product contract
        run: python3 scripts/verify_platform_contract.py

      - name: Test and package universal app
        run: |
          set -euo pipefail
          (cd macos && swift test -c release)
          bash macos/scripts/package-app.sh "$RUNNER_TEMP/password-generator-macos"
          APP="$RUNNER_TEMP/password-generator-macos/Password Generator.app"
          test -x "$APP/Contents/MacOS/PasswordGenerator"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP/Contents/Info.plist"
          archs="$(lipo -archs "$APP/Contents/MacOS/PasswordGenerator")"
          grep -qw arm64 <<< "$archs"
          grep -qw x86_64 <<< "$archs"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/password-generator.keychain-db"
          p12="$RUNNER_TEMP/password-generator-signing.p12"
          keychain_password="pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          existing_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" $existing_keychains
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          rm -f "$p12"

      - name: Sign, notarize, and package macOS release
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          APP="$RUNNER_TEMP/password-generator-macos/Password Generator.app"
          version="${RELEASE_TAG#v}"
          mkdir -p release
          dmg="release/password-generator-$version-macos-universal.dmg"
          codesign --force --options runtime --timestamp --entitlements macos/Resources/PasswordGenerator.entitlements --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil create -volname "Password Generator" -srcfolder "$APP" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          shasum -a 256 "$dmg" | sed 's#release/##' > "$dmg.sha256"

      - name: Attest macOS image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/password-generator-*-macos-universal.dmg

      - name: Upload macOS release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: password-generator-macos-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/password-generator.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/password-generator-signing.p12"

  publish:
    name: Publish unified verified release
    needs: [android, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all release payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: password-generator-*-${{ inputs.tag }}
          path: release
          merge-multiple: true

      - name: Verify downloaded payloads
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          required=(
            "password-generator-$version-android.apk"
            "password-generator-$version-android.aab"
            "password-generator-$version-windows-x64.exe"
            "password-generator-$version-macos-universal.dmg"
          )
          cd release
          for asset in "${required[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done

      - name: Refuse an existing release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create or verify immutable release tag
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Create draft unified release
        id: draft
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Password Generator ${RELEASE_TAG#v}" --notes-file ".github/release-notes/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attach verified platform assets
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Remove failed draft
        if: failure() && steps.draft.outputs.created == 'true'
        run: gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY"
