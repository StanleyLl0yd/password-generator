name: Security and Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-source-metadata:
    name: Record Gradle source checksum
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and record Gradle 8.13 sources
        env:
          EXPECTED_SHA256: 21414d6e543139c962ea95a4c61a585eb77b7a8fd45aa16f281234ae4b02c661
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-src.zip.sha256 -o expected.sha256
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-src.zip -o gradle-8.13-src.zip
          official="$(tr -d '[:space:]' < expected.sha256)"
          actual="$(sha256sum gradle-8.13-src.zip | awk '{print $1}')"
          test "$official" = "$EXPECTED_SHA256"
          test "$actual" = "$EXPECTED_SHA256"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("gradle/verification-metadata.xml")
          text = path.read_text()
          component = '<component group="gradle" name="gradle" version="8.13">'
          if component not in text:
              marker = "   </components>"
              entry = '''      <component group="gradle" name="gradle" version="8.13">
                 <artifact name="gradle-8.13-src.zip">
                    <sha256 value="21414d6e543139c962ea95a4c61a585eb77b7a8fd45aa16f281234ae4b02c661" origin="Verified" reason="Matches the official Gradle 8.13 source distribution checksum"/>
                 </artifact>
              </component>
          '''
              if marker not in text:
                  raise SystemExit("verification metadata components marker not found")
              path.write_text(text.replace(marker, entry + marker, 1))
          PY

      - name: Commit verification metadata
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: verify Gradle source distribution"
          git push origin "HEAD:$TARGET_BRANCH"

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle dependencies
        run: ./gradlew :app:dependencies --stacktrace

      - name: Run Qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692
        with:
          args: --within-docker,false,--print-problems
          upload-result: true
          artifact-name: qodana-report

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Semgrep CE
        run: semgrep scan --config auto --exclude-rule java.android.security.exported_activity.exported_activity --error .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}