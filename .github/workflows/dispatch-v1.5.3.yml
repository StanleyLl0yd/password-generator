name: Dispatch Password Generator v1.5.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v1.5.3.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Android Release v1.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v1.5.3 --repo "$GITHUB_REPOSITORY"
