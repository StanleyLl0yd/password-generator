name: Refresh Gradle Verification Metadata

on:
  push:
    branches:
      - feat/final-app-icon-v1.5.1
    paths:
      - .github/workflows/update-verification-metadata.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Refresh verification metadata
        run: ./gradlew --write-verification-metadata sha256 help --stacktrace

      - name: Verify expected metadata changes
        run: |
          git diff -- gradle/verification-metadata.xml
          git diff --quiet -- . ':(exclude)gradle/verification-metadata.xml' ':(exclude).github/workflows/update-verification-metadata.yml'
          grep -q 'guava-parent' gradle/verification-metadata.xml
          grep -q 'junit-bom' gradle/verification-metadata.xml
          grep -q 'kotlinx-coroutines-bom' gradle/verification-metadata.xml

      - name: Remove temporary workflow
        run: rm -f .github/workflows/update-verification-metadata.yml

      - name: Commit verification metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml .github/workflows/update-verification-metadata.yml
          git commit -m "build: refresh dependency verification metadata"
          git push origin HEAD:feat/final-app-icon-v1.5.1
