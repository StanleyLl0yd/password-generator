name: Import approved app icon

on:
  push:
    branches:
      - automation/app-icon-2026-08-31
    paths:
      - .github/workflows/app-icon-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/app-icon-2026-08-31
          fetch-depth: 0
          persist-credentials: true

      - name: Import approved icon into main
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/password-generator-icon
          cat .icon-upload/icon512.webp.b64.* | tr -d '\n' | base64 --decode > /tmp/password-generator-icon/app-icon.webp
          echo '2468440cc6989eb1a87538c8f5f931ea02b85f163c652cb695086de2c4db0866  /tmp/password-generator-icon/app-icon.webp' | sha256sum --check --strict

          if command -v magick >/dev/null 2>&1; then
            IMAGE_TOOL=magick
          elif command -v convert >/dev/null 2>&1; then
            IMAGE_TOOL=convert
          else
            echo 'ImageMagick is required on the runner.' >&2
            exit 1
          fi

          git fetch origin main
          git checkout -B main origin/main

          mkdir -p branding
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp /tmp/password-generator-icon/app-icon.webp branding/app-icon.webp
          "$IMAGE_TOOL" /tmp/password-generator-icon/app-icon.webp -strip -resize 512x512 -colorspace sRGB branding/store-icon-512.png

          rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cp /tmp/password-generator-icon/app-icon.webp app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp

          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec
            density=$1
            size=$2
            "$IMAGE_TOOL" /tmp/password-generator-icon/app-icon.webp -strip -resize "${size}x${size}" -quality 95 "app/src/main/res/mipmap-${density}/ic_launcher.webp"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.webp" "app/src/main/res/mipmap-${density}/ic_launcher_round.webp"
          done

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > branding/README.md <<'EOF'
          # App icon

          `app-icon.webp` is the approved canonical app icon artwork for Password Generator.

          Do not redraw, recolor, restyle, crop, replace, or otherwise alter this artwork unless the project owner explicitly requests a new icon. Resizing and format conversion are allowed only when required for Android launcher resources or store assets, while preserving the artwork itself.

          `store-icon-512.png` is the store-ready 512 px export generated from the same approved artwork. Android launcher resources under `app/src/main/res/mipmap-*` and the adaptive foreground under `app/src/main/res/drawable-nodpi` must always be derived from `app-icon.webp`.
          EOF

          cat > AGENTS.md <<'EOF'
          # Project instructions

          ## Branding

          - `branding/app-icon.webp` is the canonical approved Password Generator app icon.
          - Do not redraw, recolor, restyle, crop, replace, or otherwise alter the icon artwork unless the project owner explicitly requests it.
          - Every Android release must use launcher assets derived from this exact artwork.
          - Store listing icons must be derived from the same artwork.
          - Resizing and format conversion are allowed only when required by Android or store specifications; the composition, colors, symbols, text, lighting, and other visual elements must remain unchanged.
          - Before every release, verify that `@mipmap/ic_launcher` and `@mipmap/ic_launcher_round` resolve to assets derived from `branding/app-icon.webp`.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A AGENTS.md branding app/src/main/res
          git diff --cached --check
          git commit -m 'branding: adopt approved app icon'
          git push origin main
