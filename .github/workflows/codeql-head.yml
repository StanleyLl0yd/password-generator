name: CodeQL Head Analysis

on:
  push:
    branches-ignore:
      - main

permissions: {}

concurrency:
  group: codeql-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java and Kotlin head
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for analysis
        run: ./gradlew clean assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Analyze head commit
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
