name: Export Android Build Tools

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "build-tools;36.0.0"
      - uses: actions/upload-artifact@v7
        with:
          name: android-build-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0/
          if-no-files-found: error
          retention-days: 1
