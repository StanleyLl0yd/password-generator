name: Bootstrap final app icon

on:
  push:
    branches:
      - feat/final-app-icon-v1.5.1
    paths:
      - ".tmp/icon-*.b64"
      - ".github/workflows/icon-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Restore final icon
        run: |
          cat .tmp/icon-*.b64 | base64 --decode > "$RUNNER_TEMP/app-icon.webp"
          dimensions="$(identify -format '%wx%h' "$RUNNER_TEMP/app-icon.webp")"
          if [[ "$dimensions" != "512x512" ]]; then
            echo "Unexpected icon dimensions: $dimensions" >&2
            exit 1
          fi

      - name: Install Android icon resources
        run: |
          source="$RUNNER_TEMP/app-icon.webp"
          mkdir -p artwork store-assets
          cp "$source" artwork/app-icon.webp
          convert "$source" store-assets/app-icon-512.png

          for spec in \
            "mipmap-mdpi 48" \
            "mipmap-hdpi 72" \
            "mipmap-xhdpi 96" \
            "mipmap-xxhdpi 144" \
            "mipmap-xxxhdpi 192"
          do
            set -- $spec
            dir="app/src/main/res/$1"
            size="$2"
            convert "$source" -resize "${size}x${size}" "$dir/ic_launcher.webp"
            cp "$dir/ic_launcher.webp" "$dir/ic_launcher_round.webp"
          done

          rm -f app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          cp "$source" app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp
          sed -i '/<monochrome /d' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          sed -i '/<monochrome /d' app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Remove bootstrap files
        run: |
          rm -f .tmp/icon-*.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/icon-bootstrap.yml

      - name: Commit final icon resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adopt final app icon"
          git push origin HEAD:feat/final-app-icon-v1.5.1
