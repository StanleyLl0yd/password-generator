name: Verify Android release packages
description: Validate signed package identity, offline manifest, bundle structure and 16 KB compatibility
runs:
  using: composite
  steps:
    - name: Validate APK and AAB
      shell: bash
      run: |
        set -euo pipefail
        bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
        curl --fail --location --retry 3 \
          https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
          --output "$bundletool"
        echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum --check
        aab=app/build/outputs/bundle/release/app-release.aab
        apk=app/build/outputs/apk/release/app-release.apk
        java -jar "$bundletool" validate --bundle="$aab"
        java -jar "$bundletool" dump manifest --bundle="$aab" > "$RUNNER_TEMP/aab-manifest.xml"
        "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/apk-manifest.xml"
        python3 scripts/verify_android_package.py --manifest "$RUNNER_TEMP/aab-manifest.xml" --archive "$aab"
        python3 scripts/verify_android_package.py --manifest "$RUNNER_TEMP/apk-manifest.xml" --archive "$apk"
        "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
